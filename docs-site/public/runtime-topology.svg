<svg width="1400" height="820" viewBox="0 0 1400 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="220" y1="90" x2="1180" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDF9F2"/>
      <stop offset="1" stop-color="#F2E9DA"/>
    </linearGradient>
    <linearGradient id="core" x1="360" y1="240" x2="1030" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F6B61"/>
      <stop offset="1" stop-color="#1B2A27"/>
    </linearGradient>
    <linearGradient id="flow" x1="272" y1="188" x2="1118" y2="188" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F6B61"/>
      <stop offset="1" stop-color="#CA6B2C"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="820" rx="34" fill="#F5F0E8"/>
  <rect x="150" y="88" width="1100" height="646" rx="34" fill="url(#panel)" stroke="#16322F" stroke-opacity="0.08"/>

  <text x="192" y="138" fill="#0E3B36" font-family="Fraunces, Georgia, serif" font-size="40">AgentFlyer Runtime Topology</text>
  <text x="192" y="171" fill="#5E6B63" font-family="IBM Plex Sans, sans-serif" font-size="20">One operator-facing runtime composed as layers, not scattered features.</text>

  <rect x="192" y="206" width="1016" height="84" rx="24" fill="#FFFDF8" stroke="#16322F" stroke-opacity="0.08"/>
  <text x="228" y="242" fill="#0E3B36" font-family="Fraunces, Georgia, serif" font-size="30">Channels</text>
  <g font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#35524B">
    <rect x="370" y="224" width="120" height="46" rx="16" fill="#E6F2EE"/><text x="405" y="253">Web</text>
    <rect x="506" y="224" width="120" height="46" rx="16" fill="#EDE9F7"/><text x="540" y="253">CLI</text>
    <rect x="642" y="224" width="120" height="46" rx="16" fill="#F7EBE4"/><text x="661" y="253">Telegram</text>
    <rect x="778" y="224" width="120" height="46" rx="16" fill="#EAF0FB"/><text x="804" y="253">Discord</text>
    <rect x="914" y="224" width="120" height="46" rx="16" fill="#EAF7F4"/><text x="944" y="253">Feishu</text>
    <rect x="1050" y="224" width="120" height="46" rx="16" fill="#F8EEE3"/><text x="1091" y="253">QQ</text>
  </g>

  <path d="M700 290V330" stroke="url(#flow)" stroke-width="4" stroke-linecap="round"/>
  <path d="M700 492V532" stroke="url(#flow)" stroke-width="4" stroke-linecap="round"/>

  <rect x="286" y="330" width="828" height="162" rx="30" fill="url(#core)"/>
  <text x="332" y="375" fill="#FFF8F1" font-family="Fraunces, Georgia, serif" font-size="36">Gateway + Agent Runtime</text>
  <text x="332" y="410" fill="#D8CEC1" font-family="IBM Plex Sans, sans-serif" font-size="20">Routing, sessions, agent turns, queues, workflow backend, deliverables, approvals, operator control plane.</text>

  <rect x="332" y="434" width="172" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.1"/>
  <rect x="520" y="434" width="172" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.1"/>
  <rect x="708" y="434" width="172" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.1"/>
  <rect x="896" y="434" width="172" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.1"/>
  <g font-family="IBM Plex Mono, monospace" font-size="16" fill="#FFF8F1">
    <text x="365" y="457">Console UI</text>
    <text x="553" y="457">RPC / SSE / WS</text>
    <text x="764" y="457">Scheduler</text>
    <text x="937" y="457">Workflows</text>
  </g>

  <rect x="192" y="532" width="1016" height="160" rx="28" fill="#FFFDF8" stroke="#16322F" stroke-opacity="0.08"/>
  <text x="228" y="576" fill="#0E3B36" font-family="Fraunces, Georgia, serif" font-size="30">Services And Boundaries</text>

  <g>
    <rect x="228" y="598" width="180" height="62" rx="20" fill="#E6F2EE"/>
    <text x="271" y="623" fill="#0E3B36" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="600">Memory</text>
    <text x="251" y="646" fill="#35524B" font-family="IBM Plex Sans, sans-serif" font-size="16">SQLite + BM25 + vectors</text>

    <rect x="428" y="598" width="180" height="62" rx="20" fill="#ECE6F5"/>
    <text x="474" y="623" fill="#2E244A" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="600">Skills</text>
    <text x="452" y="646" fill="#5A4D73" font-family="IBM Plex Sans, sans-serif" font-size="16">Prompt-side composition</text>

    <rect x="628" y="598" width="180" height="62" rx="20" fill="#F7EBE4"/>
    <text x="680" y="623" fill="#5E381E" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="600">MCP</text>
    <text x="658" y="646" fill="#7A5B45" font-family="IBM Plex Sans, sans-serif" font-size="16">External tool registry</text>

    <rect x="828" y="598" width="180" height="62" rx="20" fill="#EAF5F2"/>
    <text x="867" y="623" fill="#0E3B36" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="600">Sandbox</text>
    <text x="855" y="646" fill="#35524B" font-family="IBM Plex Sans, sans-serif" font-size="16">Bounded execution</text>

    <rect x="1028" y="598" width="144" height="62" rx="20" fill="#F8EEE3"/>
    <text x="1051" y="623" fill="#6A442A" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="600">Federation</text>
    <text x="1052" y="646" fill="#7A5B45" font-family="IBM Plex Sans, sans-serif" font-size="16">Expanding layer</text>
  </g>
</svg>
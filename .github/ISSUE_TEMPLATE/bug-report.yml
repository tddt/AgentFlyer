name: Bug report
about: Report defects with clear reproduction and runtime context
labels: ["type:bug", "need:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please include enough detail so maintainers can reproduce quickly.
  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: What failed and why it matters
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Runtime, OS, and install path
      placeholder: |
        - AgentFlyer version:
        - Bun / Node version:
        - OS:
        - Deployment shape (local/single-host/multi-host):
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: Numbered steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots / traces
      render: shell
